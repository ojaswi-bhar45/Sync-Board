version: "3.8"

services:
  backend:
    build:
      context: ./sync-board-b
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./sync-board-b/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017/sync-board
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./sync-board-f
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
